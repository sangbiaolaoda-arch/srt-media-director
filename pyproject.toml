[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "srt-media-director"
version = "7.4.0"
description = "把 SRT 字幕编译为有视觉层级、空间关系、信息编码与时间节奏的动画信息场景——一个面向 AI Agent 的开源动画导演 Skill 与参考实现。"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SRT Media Director contributors" }]
keywords = ["srt", "subtitles", "infographic", "animation", "ai-agent",
            "skill", "visual-storytelling", "svg", "hyperframes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "Pillow>=9.5",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
svg = ["cairosvg>=2.7"]
video = ["imageio-ffmpeg>=0.4"]
test = ["pytest>=7.4"]
all = ["cairosvg>=2.7", "imageio-ffmpeg>=0.4", "pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/sangbiaolaoda-arch/srt-media-director"
Repository = "https://github.com/sangbiaolaoda-arch/srt-media-director"
Issues = "https://github.com/sangbiaolaoda-arch/srt-media-director/issues"

[project.scripts]
srt-director = "cli:main"

[tool.setuptools]
py-modules = ["cli"]
packages = ["runtime"]
