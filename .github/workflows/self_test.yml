name: self-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bootstrap-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install CJK font (raster probe needs real glyphs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Runtime self-test (Bootstrap Gate, VAL-03)
        run: python runtime/self_test.py
      - name: E2E sample (30s, CORE-13)
        run: python runtime/make_sample.py 30
      - name: Upload sample artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-output
          path: sample/
          retention-days: 14
