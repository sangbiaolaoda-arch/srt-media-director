name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 真实矩阵：Python 3.9–3.12 × Linux / macOS / Windows。
  # 重点覆盖 cairosvg 的系统依赖——这是这类渲染管线跨平台最常见的失败点：
  #   Linux  → libcairo2 + libffi
  #   macOS  → brew cairo + libffi（并导出 DYLD_FALLBACK_LIBRARY_PATH）
  #   Windows→ GTK runtime（cairosvg 依赖其提供的 cairo dll，需把 DLL 目录加入 PATH）
  matrix-test:
    name: py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: System cairo libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2 libffi-dev
      - name: System cairo libs (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cairo libffi
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib:$(brew --prefix libffi)/lib" >> "$GITHUB_ENV"
      - name: System cairo libs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y gtk-runtime --no-progress
          $roots = @(
            "C:\Program Files (x86)\GTK2-Runtime",
            "C:\Program Files\GTK2-Runtime"
          )
          foreach ($r in $roots) {
            if (Test-Path $r) {
              Get-ChildItem -Path $r -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty DirectoryName -Unique |
                ForEach-Object { Add-Content -Path $env:GITHUB_PATH -Value $_ }
            }
          }

      - name: Install CJK font (raster probe needs real glyphs)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: cairosvg import probe (fails loudly if system cairo missing)
        run: python -c "import cairosvg; print('cairosvg', cairosvg.__version__)"

      - name: Runtime self-test (Bootstrap Gate, VAL-03)
        run: python runtime/self_test.py

      - name: E2E sample compile (30s, CORE-13)
        run: python runtime/make_sample.py 30 --no-render

  # 黄金回归：固定 SRT + 各层中间产物哈希比对（种子跨机器可复现的回归支撑）。
  golden:
    name: golden regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CJK font (golden layout depends on font metrics)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: pytest (golden hashes)
        run: python -m pytest tests -q

  # 备用 SVG 后端：不依赖系统 cairo（resvg / 纯 Python），验证降级路径。
  svg-fallback:
    name: svg fallback (no system cairo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal deps (no cairosvg)
        run: python -m pip install --upgrade pip pillow jsonschema
      - name: Backend probe (must degrade, not crash)
        run: python runtime/svg_backend.py --probe
