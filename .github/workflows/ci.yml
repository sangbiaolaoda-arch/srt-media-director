name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Windows runners default stdout to the legacy cp1252 code page, so the
  # runtime's unicode output (CJK gate names, em-dash / check-mark glyphs)
  # raises UnicodeEncodeError in self_test.py. Force UTF-8 I/O everywhere.
  PYTHONUTF8: "1"

jobs:
  # 真实矩阵：Python 3.9–3.12 × Linux / macOS / Windows。
  # 重点覆盖 cairosvg 的系统依赖——这是这类渲染管线跨平台最常见的失败点：
  #   Linux  → libcairo2 + libffi
  #   macOS  → brew cairo + libffi
  #   Windows→ GTK runtime（cairosvg 依赖其提供的 cairo dll）
  matrix-test:
    name: py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: System cairo libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2 libffi-dev
      - name: System cairo libs (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cairo libffi
          # cairocffi dlopen()s libcairo.2.dylib by bare name; macOS does not
          # search homebrew's prefix by default, so expose it as a fallback path.
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix cairo)/lib:$(brew --prefix libffi)/lib" >> "$GITHUB_ENV"
      - name: System cairo libs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # choco's gtk-runtime is 32-bit only (installs to Program Files (x86)),
          # which the 64-bit runner Python cannot load -> ffi.dlopen fails with
          # error 0xc1 (ERROR_BAD_EXE_FORMAT). Use the 64-bit cairo from the
          # MSYS2 toolchain that is preinstalled on the windows runner instead.
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-x86_64-cairo"
          # cairocffi loads cairo through cffi's ffi.dlopen('libcairo-2.dll'). That
          # call uses LoadLibraryExW(LOAD_WITH_ALTERED_SEARCH_PATH), which does NOT
          # consult the directories registered by CAIROCFFI_DLL_DIRECTORIES /
          # os.add_dll_directory — so the env-var hook alone still failed with
          # error 0x7e (ERROR_MOD_NOT_FOUND) even though cairo was installed.
          # PATH *is* searched, so stage the cairo DLLs (plus their freetype / glib /
          # fontconfig / pixman / png dependencies) in a dedicated directory that
          # contains NO python.exe, then expose only that directory on PATH.
          # We deliberately avoid putting C:\msys64\mingw64\bin itself on PATH: it
          # ships its own python.exe that would shadow the runner interpreter and
          # break `python -m pip`.
          New-Item -ItemType Directory -Force C:\cairo-dll | Out-Null
          Copy-Item C:\msys64\mingw64\bin\*.dll C:\cairo-dll -Force
          "C:\cairo-dll" | Out-File -Append -Encoding ascii $env:GITHUB_PATH

      - name: Install CJK font (raster probe needs real glyphs)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: cairosvg import probe (fails loudly if system cairo missing)
        run: python -c "import cairosvg; print('cairosvg', cairosvg.__version__)"

      - name: Runtime self-test (Bootstrap Gate, VAL-03)
        run: python runtime/self_test.py

      - name: E2E sample compile (30s, CORE-13)
        run: python runtime/make_sample.py 30 --no-render

  # 黄金回归：固定 SRT + 各层中间产物哈希比对（种子跨机器可复现的回归支撑）。
  golden:
    name: golden regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CJK font (render-plan footprints are measured from real glyphs)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: pytest (golden hashes)
        run: python -m pytest tests -q

  # 备用 SVG 后端：不依赖系统 cairo（resvg / 纯 Python），验证降级路径。
  svg-fallback:
    name: svg fallback (no system cairo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal deps (no cairosvg)
        run: python -m pip install --upgrade pip pillow jsonschema
      - name: Backend probe (must degrade, not crash)
        run: python runtime/svg_backend.py --probe
