name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 真实矩阵：Python 3.9–3.12 × Linux / macOS / Windows。
  # 重点覆盖 cairosvg 的系统依赖——这是这类渲染管线跨平台最常见的失败点：
  #   Linux  → libcairo2 + libffi
  #   macOS  → brew cairo + libffi（并导出 DYLD_FALLBACK_LIBRARY_PATH）
  #   Windows→ MSYS2 mingw-w64 的 64 位 cairo（DLL 名恰为 libcairo-2.dll，
  #            与 x64 CPython 架构匹配；choco 的 GTK2-Runtime 只有 32 位，会因
  #            架构不符报 error 0xc1）
  matrix-test:
    name: py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: System cairo libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2 libffi-dev
      - name: System cairo libs (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cairo libffi
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib:$(brew --prefix libffi)/lib" >> "$GITHUB_ENV"
      - name: System cairo libs (Windows, 64-bit via MSYS2 mingw-w64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-cairo
      - name: Add mingw64 to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install CJK font (raster probe needs real glyphs)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: cairosvg import probe (fails loudly if system cairo missing)
        run: python -c "import cairosvg; print('cairosvg', cairosvg.__version__)"

      - name: Runtime self-test (Bootstrap Gate, VAL-03)
        run: python runtime/self_test.py

      - name: E2E sample compile (30s, CORE-13)
        run: python runtime/make_sample.py 30 --no-render

  # 黄金回归：固定 SRT + 各层中间产物哈希比对（种子跨机器可复现的回归支撑）。
  golden:
    name: golden regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CJK font (golden layout depends on font metrics)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: pytest (golden hashes)
        run: python -m pytest tests -q

  # 备用 SVG 后端：不依赖系统 cairo（resvg / 纯 Python），验证降级路径。
  svg-fallback:
    name: svg fallback (no system cairo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal deps (no cairosvg)
        run: python -m pip install --upgrade pip pillow jsonschema
      - name: Backend probe (must degrade, not crash)
        run: python runtime/svg_backend.py --probe
