name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 真实矩阵：Python 3.9–3.12 × Linux / macOS / Windows。
  # cairosvg 的系统依赖是这类渲染管线跨平台最常见的失败点。本项目的设计立场是
  # 「无系统 cairo 时优雅降级，而非崩溃」：
  #   - Linux  → 装 libcairo2 + libffi（走 cairosvg 主路径）
  #   - macOS  → brew cairo + libffi + DYLD_FALLBACK_LIBRARY_PATH
  #   - Windows→ 不装 cairo：runtime 里 cairosvg 为可选导入，光栅门禁在无后端时
  #             显式 SKIP，端到端样例仍可 --no-render 通过（见 svg-fallback 作业）
  matrix-test:
    name: py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: System cairo libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2 libffi-dev
      - name: System cairo libs (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cairo libffi
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib:$(brew --prefix libffi)/lib" >> "$GITHUB_ENV"

      - name: Install CJK font (raster probe needs real glyphs)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: SVG backend probe (must degrade gracefully, not crash)
        run: python runtime/svg_backend.py --probe

      - name: Runtime self-test (Bootstrap Gate, VAL-03)
        run: python runtime/self_test.py

      - name: E2E sample compile (30s, CORE-13)
        run: python runtime/make_sample.py 30 --no-render

  # 黄金回归：固定 SRT + 各层中间产物哈希比对（种子跨机器可复现的回归支撑）。
  golden:
    name: golden regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CJK font (golden layout depends on font metrics)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: pytest (golden hashes)
        run: python -m pytest tests -q

  # 备用 SVG 后端：不依赖系统 cairo（resvg / 纯 Python），验证降级路径。
  svg-fallback:
    name: svg fallback (no system cairo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal deps (no cairosvg)
        run: python -m pip install --upgrade pip pillow jsonschema
      - name: Backend probe (must degrade, not crash)
        run: python runtime/svg_backend.py --probe
